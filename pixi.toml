[workspace]
preview = ["pixi-build"]
authors = ["Maxim Zaks <maxim.zaks@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mm_string_dict"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
test = "mojo -I . test/test_string_dict.mojo"
main = "mojo -I . examples/main.mojo"
bench = "mojo -D ASSERT=none -I . benchmarks/bench_string_dict.mojo"
bench-destructive = "mojo -D ASSERT=none -D DESTRUCTIVE=true -I . benchmarks/bench_destructive.mojo"
bench-non-destructive = "mojo -D ASSERT=none -D DESTRUCTIVE=false -I . benchmarks/bench_destructive.mojo"
bench-narrow = "mojo -D ASSERT=none -I . benchmarks/bench_narrow.mojo"
bench-small-maps = "mojo -D ASSERT=none -I . benchmarks/bench_small_maps.mojo"
bench-anatomy = "mojo -D ASSERT=none -I . benchmarks/bench_insert_anatomy.mojo"
bench-uncached = "mojo -D ASSERT=none -D CACHING=false -I . benchmarks/bench_string_dict.mojo"
bench-anatomy-uncached = "mojo -D ASSERT=none -D CACHING=false -I . benchmarks/bench_insert_anatomy.mojo"
format = "mojo format ./"
docs = "mojo doc --diagnose-missing-doc-strings -o /dev/null mm_string_dict/"

[dependencies]
mojo = ">=1.1.0.dev2026091105,<2"

[package]
name = "mm_string_dict"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.7", channels = [
  "https://prefix.dev/pixi-build-backends",
  "conda-forge",
] }

[package.host-dependencies]
mojo = ">=1.1.0.dev2026091105,<2"

[package.run-dependencies]
mojo = ">=1.1.0.dev2026091105,<2"
